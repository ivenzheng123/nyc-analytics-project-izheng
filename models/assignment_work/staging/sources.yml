version: 2
sources:
  - name: raw
    description: Raw data loaded from NYC Open Data
    database: ivenzheng-cis-4400-f25
    schema: nyc_311_raw_data
    tables:
      - name: source_dot_service_requests_history
        description: |
          NYC 311 service requests for Dept of Transportation.
          One row per service request.
        columns:
          - name: unique_key
            description: Unique ID for the service request
            tests:
              - unique
              - not_null
          - name: created_date
            description: Date and time the request was created
          - name: closed_date
            description: Date and time the request was closed
          - name: agency
            description: Agency code
          - name: agency_name
            description: Full name of the agency
          - name: complaint_type
            description: Type of complaint
          - name: descriptor
            description: Further description of the complaint
          - name: descriptor_2
            description: Additional description of the complaint
          - name: location_type
            description: Location where the incident occurred
          - name: incident_zip
            description: Zip code of the incident location
          - name: incident_address
            description: Street address of the incident
          - name: latitude
            description: Latitude coordinate
          - name: longitude
            description: Longitude coordinate
          - name: address_type
            description: 'Type of address (e.g., ADDRESS, INTERSECTION, BLOCKFACE)'
          - name: bbl
            description: Borough Block and Lot number (NYC tax lot id)
          - name: borough
            description: NYC borough where incident occurred
          - name: bridge_highway_direction
            description: Direction on bridge or highway
          - name: bridge_highway_name
            description: Name of bridge or highway
          - name: bridge_highway_segment
            description: Specific segment of bridge or highway
          - name: city
            description: City name
          - name: community_board
            description: Community board district
          - name: cross_street_1
            description: First cross street
          - name: cross_street_2
            description: Second cross street
          - name: due_date
            description: Expected resolution date
          - name: facility_type
            description: Type of facility
          - name: intersection_street_1
            description: First intersection street
          - name: intersection_street_2
            description: Second intersection street
          - name: open_data_channel_type
            description: Submission channel type
          - name: park_borough
            description: Park borough
          - name: park_facility_name
            description: Park facility name
          - name: resolution_action_updated_date
            description: Last update date
          - name: resolution_description
            description: Resolution description
          - name: road_ramp
            description: Road ramp identifier
          - name: status
            description: Current status
          - name: street_name
            description: Street name
          - name: x_coordinate_state_plane
            description: X coordinate
          - name: y_coordinate_state_plane
            description: Y coordinate
          - name: landmark
            description: Nearby landmark

  - name: raw
    description: Open restaurant applications data
    database: ivenzheng-cis-4400-f25
    schema: nyc_hw3_raw_data
    tables:
      - name: source_nyc_open_restaurant_apps
        description: NYC open restaurant applications
        columns:
          - name: objectid
            description: Unique application ID
            tests:
              - not_null
              - unique
          - name: globalid
            description: Global unique identifier
          - name: seating_interest_sidewalk
            description: Seating interest (Sidewalk, Roadway, or Both)
          - name: restaurant_name
            description: Name of the restaurant
          - name: legal_business_name
            description: Legal registered business name
          - name: doing_business_as_dba
            description: DBA name
          - name: building_number
            description: Building number
          - name: street
            description: Street name
          - name: borough
            description: Borough
          - name: zip
            description: ZIP code
          - name: business_address
            description: Full business address
          - name: food_service_establishment
            description: Food service permit number
          - name: sidewalk_dimensions_length
            description: Sidewalk seating length
          - name: sidewalk_dimensions_width
            description: Sidewalk seating width
          - name: sidewalk_dimensions_area
            description: Sidewalk seating area
          - name: roadway_dimensions_length
            description: Roadway seating length
          - name: roadway_dimensions_width
            description: Roadway seating width
          - name: roadway_dimensions_area
            description: Roadway seating area
          - name: approved_for_sidewalk_seating
            description: Approved for sidewalk seating
          - name: approved_for_roadway_seating
            description: Approved for roadway seating
          - name: qualify_alcohol
            description: Qualifies for alcohol service
          - name: sla_serial_number
            description: SLA serial number
          - name: sla_license_type
            description: SLA license type
          - name: landmark_district_or_building
            description: Landmark designation
          - name: landmarkdistrict_terms
            description: Landmark terms
          - name: healthcompliance_terms
            description: Health compliance terms
          - name: time_of_submission
            description: Submission timestamp
          - name: latitude
            description: Latitude coordinate
          - name: longitude
            description: Longitude coordinate
          - name: community_board
            description: Community board
          - name: council_district
            description: Council district
          - name: census_tract
            description: Census tract
          - name: bin
            description: Building Identification Number
          - name: bbl
            description: Borough-Block-Lot
          - name: nta
            description: Neighborhood Tabulation Area